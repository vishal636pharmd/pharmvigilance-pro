<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVPro — Enter Bill Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0D1B2A; color: #E8F4FD;
      min-height: 100vh; padding: 28px 20px;
    }
    .back { color: #4FC3F7; font-size: 13px; text-decoration: none; display: block; margin-bottom: 24px; }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #90CAF9; font-size: 13px; margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: #B0BEC5; margin-bottom: 6px; }
    textarea {
      width: 100%; background: #1A2A3A; border: 1px solid #1E3A5F;
      border-radius: 10px; padding: 14px; color: #E8F4FD;
      font-size: 14px; margin-bottom: 20px; height: 90px; resize: none;
    }
    .error {
      background: #B71C1C22; border: 1px solid #EF5350; color: #EF9A9A;
      padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
    }
    button {
      width: 100%; padding: 16px; background: #1565C0; color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
    }
  </style>
</head>
<body>
  <a href="/" class="back">← Back</a>
  <h2>Enter your invoice link</h2>
  <p class="sub">
    After entering the OTP on Apollo's page, copy the final invoice page link
    (starts with invoice.apollopharmacy.in) and paste it below.
  </p>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <label>INVOICE URL</label>
    <textarea name="invoice_url" placeholder="https://invoice.apollopharmacy.in/..."></textarea>
    <button type="submit">Process Bill →</button>
  </form>
</body>
</html>
