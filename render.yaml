services:
  - type: web
    name: pharmvigilance-pro
    env: python
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev && pip install -r requirements.txt
    startCommand: gunicorn webapp.app:app
    plan: free
    envVars:
      - key: TESSDATA_PREFIX
        value: /usr/share/tesseract-ocr/5/tessdata
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: PVPI_RECIPIENT_EMAIL
        value: pvpi@ipcindia.net
      - key: SUBMISSION_COPY_TO
        sync: false
  - type: cron
    name: pharmvigilance-reminders
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m modules.reminder_system
    schedule: "0 9 * * *"
    plan: starter
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
